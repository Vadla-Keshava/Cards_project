
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile Cards</title>

    <link rel="stylesheet" href="index.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="container">

        <!-- First Profile Card -->
        <div class="card">

            <div class="header">
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>

            <img src="https://i.pravatar.cc/300?img=12"
                 alt="Prem Shahi" class="profile-pic">

            <h2>Prem Shahi</h2>
            <p>Web Developer</p>

            <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>

            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>

        </div>


        <!-- Second Profile Card -->
        <div class="card">

            <div class="header">
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>

            <img src="https://i.pravatar.cc/300?img=47"
                 alt="Deepa Chand" class="profile-pic">

            <h2>Deepa Chand</h2>
            <p>App Developer</p>

            <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>

            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>

        </div>


        <!-- Third Profile Card -->
        <div class="card">

            <div class="header">
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                </div>
            </div>

            <img src="https://i.pravatar.cc/300?img=11"
                 alt="Praka Shahi" class="profile-pic">

            <h2>Praka Shahi</h2>
            <p>Photographer</p>

            <div class="stars">
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-solid fa-star"></i>
                <i class="fa-regular fa-star"></i>
            </div>

            <div class="buttons">
                <button>About Me</button>
                <button>Hire Me</button>
            </div>

        </div>

    </div>

</body>
</html>
